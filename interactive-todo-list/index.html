<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Interactive To-Do List built with HTML, CSS, JavaScript and LocalStorage."
    >

    <title>TaskFlow | Interactive To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="app-header">
            <div>
                <p class="eyebrow">PERSONAL TASK MANAGER</p>
                <h1>TaskFlow<span>.</span></h1>
                <p class="subtitle">
                    Organize your day. Complete your goals.
                </p>
            </div>

            <div class="date-box">
                <span id="currentDate">Today</span>
            </div>
        </header>


        <!-- Task Input -->
        <section class="task-input-section">

            <form id="taskForm">

                <div class="input-wrapper">
                    <span class="input-icon">+</span>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="What do you need to accomplish?"
                        maxlength="100"
                        autocomplete="off"
                    >

                    <button type="submit" id="addTaskBtn">
                        Add Task
                    </button>
                </div>

            </form>

            <p id="errorMessage" class="error-message"></p>

        </section>


        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-number" id="totalTasks">0</span>
                <span class="stat-label">Total</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="activeTasks">0</span>
                <span class="stat-label">Active</span>
            </div>

            <div class="stat-card">
                <span class="stat-number" id="completedTasks">0</span>
                <span class="stat-label">Completed</span>
            </div>

        </section>


        <!-- Task Controls -->
        <section class="task-controls">

            <div class="filters">

                <button
                    type="button"
                    class="filter-btn active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="active"
                >
                    Active
                </button>

                <button
                    type="button"
                    class="filter-btn"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

            <button
                type="button"
                id="clearCompleted"
                class="clear-btn"
            >
                Clear Completed
            </button>

        </section>


        <!-- Task List -->
        <section class="tasks-section">

            <ul id="taskList" class="task-list">
                <!-- Tasks will be generated using JavaScript -->
            </ul>

            <div id="emptyState" class="empty-state">

                <div class="empty-icon">✓</div>

                <h2>No tasks yet</h2>

                <p>
                    Add your first task and start getting things done.
                </p>

            </div>

        </section>


        <!-- Footer -->
        <footer class="app-footer">

            <p>
                Built with HTML, CSS & JavaScript
            </p>

            <span>•</span>

            <p>
                Data saved locally in your browser
            </p>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
